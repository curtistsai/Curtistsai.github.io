<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 周年紀念猜謎翻牌</title>
<!-- 只有在用「網址自動產生 QR Code」時才會用到這個函式庫 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c6 100%);
    color: #5a2a3a; padding: 24px 16px; overflow-x: hidden;
  }
  h1 { font-size: clamp(22px, 6vw, 32px); margin-bottom: 6px; text-align: center; }
  .sub { font-size: 15px; opacity: .8; margin-bottom: 18px; text-align: center; }
  .progress { margin-bottom: 16px; font-weight: bold; }
  .progress span { color: #fb6f92; }

  /* 九宮格 */
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    width: min(90vw, 420px); padding: 12px;
    background: rgba(255,255,255,.45); border-radius: 22px;
    box-shadow: 0 10px 30px rgba(251,111,146,.25);
    transition: gap .8s ease, padding .8s ease, background .8s ease, border-radius .8s ease;
  }
  .board.done { gap: 0; padding: 22px; background: #fff; border-radius: 8px; }

  .card { aspect-ratio: 1 / 1; perspective: 900px; cursor: pointer; }
  .card.flipped { cursor: default; }
  .inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .8s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card:not(.flipped):hover .inner { transform: translateY(-4px) scale(1.03); }

  .face {
    position: absolute; inset: 0; border-radius: 14px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    transition: border-radius .8s ease;
  }
  .back {
    background: linear-gradient(145deg, #ff8fab, #fb6f92);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
  }
  .back .num { font-size: clamp(26px, 8vw, 40px); font-weight: bold; }
  .back .heart { font-size: clamp(14px, 4vw, 20px); margin-top: 2px; }
  .front {
    transform: rotateY(180deg);
    background-color: #fff; background-repeat: no-repeat;
    background-size: 300% 300%;
    image-rendering: pixelated;
  }
  .board.done .face { border-radius: 0; }

  /* 題目視窗 */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(90,42,58,.45);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 20px; padding: 26px 22px; width: min(92vw, 380px);
    text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,.2);
    animation: pop .3s ease;
  }
  .modal h2 { font-size: 16px; color: #fb6f92; margin-bottom: 10px; }
  .modal .q { font-size: 20px; font-weight: bold; margin-bottom: 18px; line-height: 1.5; }
  .modal input {
    width: 100%; padding: 12px 14px; font-size: 17px; border: 2px solid #ffc2d1;
    border-radius: 12px; outline: none; text-align: center;
  }
  .modal input:focus { border-color: #fb6f92; }
  .msg { min-height: 24px; margin: 10px 0 6px; font-size: 15px; }
  .msg.err { color: #e63946; }
  .msg.ok { color: #2a9d8f; }
  .hint { font-size: 14px; color: #9a6a7a; min-height: 20px; margin-bottom: 12px; }
  .btns { display: flex; gap: 10px; justify-content: center; }
  button {
    border: none; border-radius: 999px; padding: 10px 20px; font-size: 15px;
    cursor: pointer; font-family: inherit;
  }
  .btn-main { background: #fb6f92; color: #fff; font-weight: bold; }
  .btn-sub { background: #ffe5ec; color: #5a2a3a; }
  .shake { animation: shake .4s; }

  .final {
    margin-top: 20px; font-size: 20px; font-weight: bold; text-align: center;
    opacity: 0; transform: translateY(10px); transition: all .8s ease .6s; line-height: 1.6;
  }
  .final.show { opacity: 1; transform: none; }

  .fall-heart {
    position: fixed; top: -40px; pointer-events: none; z-index: 20;
    animation: fall linear forwards;
  }

  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .2; } }
</style>
</head>
<body>

<h1 id="title"></h1>
<p class="sub" id="subtitle"></p>
<p class="progress">已翻開 <span id="count">0</span> / 9</p>

<div class="board" id="board"></div>
<p class="final" id="final"></p>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <h2 id="mNum"></h2>
    <div class="q" id="mQ"></div>
    <input id="mInput" type="text" placeholder="輸入答案…" autocomplete="off">
    <div class="msg" id="mMsg"></div>
    <div class="hint" id="mHint"></div>
    <div class="btns">
      <button class="btn-sub" id="btnHint">💡 提示</button>
      <button class="btn-sub" id="btnClose">關閉</button>
      <button class="btn-main" id="btnSubmit">送出 ❤</button>
    </div>
  </div>
</div>

    if (typeof QRCode === "undefined") return reject("QR Code 函式庫沒有載入（可能沒有網路）");
    const tmp = document.createElement("div");
    new QRCode(tmp, { text: QR_TEXT, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.H });
    setTimeout(() => {
      const canvas = tmp.querySelector("canvas");
      canvas ? resolve(canvas.toDataURL("image/png")) : reject("QR Code 產生失敗");
    }, 50);
  });
}

function buildBoard(qrUrl) {
  QUIZ.slice(0, 9).forEach((item, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="inner">
        <div class="face back"><div class="num">${i + 1}</div><div class="heart">♥</div></div>
        <div class="face front" style="background-image:url('${qrUrl}');
             background-position:${col * 50}% ${row * 50}%"></div>
      </div>`;
    card.addEventListener("click", () => openQuestion(i, card));
    board.appendChild(card);
  });
}

function openQuestion(i, card) {
  if (card.classList.contains("flipped")) return;
  current = i;
  wrongTimes = 0;
  mNum.textContent = `第 ${i + 1} 題`;
  mQ.textContent = QUIZ[i].q;
  mInput.value = "";
  mMsg.textContent = ""; mMsg.className = "msg";
  mHint.textContent = "";
  modalBg.classList.add("show");
  setTimeout(() => mInput.focus(), 100);
}

function closeModal() { modalBg.classList.remove("show"); current = -1; }

function submit() {
  if (current < 0) return;
  const ans = normalize(mInput.value);
  if (!ans) return;
  const ok = QUIZ[current].any || QUIZ[current].a.some(a => normalize(a) === ans);
  if (ok) {
    mMsg.textContent = QUIZ[current].any ? "好，我們一起完成它 💖" : "答對了！💖";
    mMsg.className = "msg ok";
    const card = board.children[current];
    setTimeout(() => {
      closeModal();
      card.classList.add("flipped");
      solved++;
      countEl.textContent = solved;
      if (solved === Math.min(9, QUIZ.length)) setTimeout(finish, 900);
    }, 600);
  } else {
    wrongTimes++;
    mMsg.textContent = wrongTimes >= 3 ? "再想想～已經幫你打開提示了 🥺" : "不對喔，再想想～ 😝";
    mMsg.className = "msg err";
    if (wrongTimes >= 3) showHint();
    modal.classList.remove("shake"); void modal.offsetWidth; modal.classList.add("shake");
    mInput.select();
  }
}

function showHint() {
  if (current >= 0) mHint.textContent = "💡 " + (QUIZ[current].hint || "沒有提示，加油！");
}

function finish() {
  board.classList.add("done");
  finalEl.innerHTML = FINAL_MSG;
  finalEl.classList.add("show");
  const emojis = ["💖", "💕", "💗", "💘", "🌹", "✨"];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const h = document.createElement("div");
      h.className = "fall-heart";
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = 16 + Math.random() * 22 + "px";
      h.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6500);
    }, i * 80);
  }
}

document.getElementById("btnSubmit").onclick = submit;
document.getElementById("btnClose").onclick = closeModal;
document.getElementById("btnHint").onclick = showHint;
mInput.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
modalBg.addEventListener("click", e => { if (e.target === modalBg) closeModal(); });

getQRUrl().then(buildBoard).catch(err => alert(err));
</script>
</body>
</html>
